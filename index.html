<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101010">
  <link rel="icon" href="data:,">
  <title>한국 간판 100년</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="model-layer"><canvas id="scene" aria-label="360도 XYZ 회전 및 확대 가능한 5면 공간 모델"></canvas></div>
  <div id="model-interaction" aria-label="모델 회전과 확대 영역"></div>
  <nav id="archive" aria-label="스크롤에 따라 오른쪽에서 왼쪽으로 이동하는 1/4원 사진 타임라인"><svg id="archive-arc" aria-hidden="true"><path id="archive-arc-track" fill="none" stroke="transparent" stroke-width="120"/></svg></nav>
  <main id="stage" aria-label="공간 사진">
    <div id="picture-frame">
      <img id="fallback" alt="" hidden>
      <svg id="debug-overlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" hidden></svg>
    </div>
    <div id="caption" aria-live="polite"><p id="photo-year"></p><p id="photo-description"></p></div>
  </main>
  <div id="timeline-scroll-zone" aria-label="오른쪽 타임라인 스크롤 영역"></div>
  <aside id="timeline" aria-label="시대별 재질·서체·색상과 제도">
    <header id="era-specimen" aria-live="polite">
      <div id="specimen-glyph" aria-hidden="true">가</div>
      <div id="specimen-info"><p id="specimen-material"></p><p id="specimen-type"></p><div id="specimen-colors" aria-label="시대별 대표 색채"></div></div>
    </header>
    <div id="era-scroll"><div id="eras"></div></div>
    <div id="timeline-bottom-scroll" aria-label="사진과 시대 전체 구조 스크롤 영역" title="사진과 시대 전체 스크롤"></div>
  </aside>
  <section id="ending-scene" aria-label="2020년대 정보 과부하 엔딩" hidden>
    <img id="ending-intro" alt="상가 건물의 외벽을 채운 간판들" hidden>
    <div id="ending-collage" aria-label="겹쳐 나타나는 간판 사진들"></div>
    <p id="ending-message"></p>
    <div id="ending-question-panel" aria-label="간판 개선 사업에 대한 질문" aria-live="polite" hidden>
      <p id="ending-question"><span class="question-lead">간판 개선 사업은 사업의 목적 중</span>거리의 시각적 <strong>환경</strong>을 실제로 개선했는가?</p>
      <button id="ending-home" type="button" aria-label="메인 화면으로 이동">↑</button>
    </div>
    <button id="ending-back" type="button">- 돌아가기</button>
  </section>
  <dialog id="enlarged" aria-label="확대한 사진">
    <button id="back" type="button" aria-label="돌아가기"><span aria-hidden="true">-</span><span>돌아가기</span></button>
    <div id="zoom-surface"><img id="zoom-photo" alt=""></div>
  </dialog>
  <script id="archive-data" type="application/json">null</script>
  <script id="projection-data" type="application/json">null</script>
  <script type="module" src="app.js"></script>
</body>
</html>
